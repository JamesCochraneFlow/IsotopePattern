function parseFormula(formula){
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }
  if (!("H" in comp)){
    comp["D"] -= nValue;
    comp["H"] = nValue;
  }
  else if (!("D" in comp)) {
  comp["D"] = -nValue;
  comp["H"] += nValue;
  }
  else {
    comp["H"] += nValue;
    comp["D"] -= nValue;
  }
  return comp;
}

function binShifts(peaks){
const bins = new Map();
const lowMassBin = 0.001; // high-precision bin for low-mass elements
const highMassBin = 0.001; // slightly coarser for high-mass elements


for(const p of peaks){
if(typeof p.mass !== 'number' || typeof p.intensity !== 'number')
throw new Error('Invalid peak: '+JSON.stringify(p));


const bin = Math.abs(p.mass) < 50 ? lowMassBin : highMassBin;
// floating-point stable binning
const key = Math.round((p.mass + 1e-12) / bin) * bin;
bins.set(key, (bins.get(key) || 0) + p.intensity);
}


// preserve zero-shift peak
if(!bins.has(0)) bins.set(0, (bins.get(0) || 0));


return [...bins.entries()].map(([m,i]) => ({ mass: m, intensity: i }));
}



function generateElementArray(element, count){
const data = elements[element];
if(!data) throw new Error('Unknown element: '+element);
const mono = data.masses[0];


const poly = data.masses.map((m,i) => ({ mass: m - mono, intensity: data.abundances[i] }));


let dist = [{ mass: 0, intensity: 1 }];
for(let j=0; j<count; j++){
const tmp = [];
for(const d of dist){
for(const p of poly){
tmp.push({ mass: d.mass + p.mass, intensity: d.intensity * p.intensity });
}
}
dist = binShifts(tmp);
}
return dist;
}



function convolve(a,b){
const tmp = [];
for(const x of a){
for(const y of b){
tmp.push({ mass: x.mass + y.mass, intensity: x.intensity * y.intensity });
}
}
if(!tmp.some(p => p.mass === 0)) tmp.push({ mass:0,intensity:0 });
return binShifts(tmp);
}

function isotopePatternFFT(formula){
const comp = parseFormula(formula);
let monoMass = 0;
let dist = [{ mass: 0, intensity: 1 }];


for(const el in comp){
const e = elements[el];
if(!e) throw new Error('Unknown element: '+el);
dist = convolve(dist, generateElementArray(el, comp[el]));
monoMass += e.masses[0] * comp[el];
}


const maxI = Math.max(...dist.map(p => p.intensity));
if(maxI <= 0 || !isFinite(maxI)) throw new Error('Invalid max intensity');


return dist.map(p => ({ mass: monoMass + p.mass, intensity: p.intensity / maxI }))
.filter(p => p.intensity > cutoffFactor);
}

function getMostIntenseMassCl(formula){
  const pattern = addIsotopeHalidePatterns(isotopePatternFFTRemoveDAddCl(formula),isotopePatternFFTRemoveHAddCl(formula));
  if (!pattern.length) return NaN;

  let maxPeak = pattern[0];
  for (const p of pattern) {
    if (p.intensity > maxPeak.intensity) {
      maxPeak = p;
    }
  }
  return maxPeak.mass;
}

function draw(peaks, charge, plotid, title) {
  const canvas = document.getElementById(plotid);
  const ctx = canvas.getContext('2d');
  ctx.font = "11px Arial";
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Decide axis values explicitly
  const xvals = peaks.map(p =>
    charge > 0
      ? (p.mass + charge * protonMass) / charge   // m/z
      : p.mass                                    // neutral mass
  );

  const minX = Math.min(...xvals);
  const maxX = Math.max(...xvals);

  ctx.beginPath();

  peaks.forEach((p, i) => {
    const x = 50 + ((xvals[i] - minX) / (maxX - minX)) * (canvas.width - 80);
    const y = canvas.height - 30;
    const h = p.intensity * (canvas.height - 60);

    ctx.moveTo(x, y);
    ctx.lineTo(x, y - h);
    ctx.lineWidth = thicknessvalue;

    ctx.fillStyle = "black";
    if (masstogglevalue == 0) {
    x_string = parseFloat(xvals[i].toFixed(2)); ////////////////////////
    ctx.fillText(x_string,x-15,y-h-5);
    } 
    else {}
  });

  ctx.stroke();

  ctx.font = "20px Arial";
  ctx.fillStyle = "red";
  ctx.fillText(title, 850, 30);

  ctx.font = "12px Arial";
  ctx.fillStyle = "red";
  ctx.fillText(chargeValue.toString() + "+", 934, 20);
}

function addIsotopePatterns(p1, p2, p3, p4, p5) {
  const map = new Map();

  function addPeaks(peaks) {
    for (let i = 0; i < peaks.length; i++) {
      const p = peaks[i];
      const bin = p.mass < 50 ? lowMassBin : highMassBin;
      const key = Math.round(p.mass / bin) * bin;
      map.set(key, (map.get(key) || 0) + p.intensity);
    }
  }

  addPeaks(p1);
  addPeaks(p2);
  addPeaks(p3);
  addPeaks(p4);
  addPeaks(p5);

  let maxI = 0;
  for (const v of map.values()) {
    if (v > maxI) maxI = v;
  }

  const out = [];
  for (const [m, i] of map.entries()) {
    const norm = i / maxI;
    if (norm > cutoffFactor) {
      out.push({ mass: m, intensity: norm });
    }
  }

  return out;
}


function addIsotopeHalidePatterns(p1, p2) {
  const map = new Map();

  function addPeaks(peaks) {
    for (let i = 0; i < peaks.length; i++) {
      const p = peaks[i];
      const bin = p.mass < 50 ? lowMassBin : highMassBin;
      const key = Math.round(p.mass / bin) * bin;
      map.set(key, (map.get(key) || 0) + p.intensity);
    }
  }

  addPeaks(p1);
  addPeaks(p2);
 
  let maxI = 0;
  for (const v of map.values()) {
    if (v > maxI) maxI = v;
  }

  const out = [];
  for (const [m, i] of map.entries()) {
    const norm = i / maxI;
    if (norm > cutoffFactor) {
      out.push({ mass: m, intensity: norm });
    }
  }

  return out;
}

    ctx.font = "12px Arial";
    ctx.fillStyle = "red";
    ctx.fillText(chargeValue.toString() + "+",135+((maxPeak+36-minX)/(maxX-minX))*(canvas.width-80),132); ////////////////
    ctx.fillText(chargeValue.toString() + "+",135+((maxPeak+80-minX)/(maxX-minX))*(canvas.width-80),132);
  }
  
  else{


    ctx.fillText("[M-(D/H)+Cl]",20+((maxPeak+(36/charge)-minX)/(maxX-minX))*(canvas.width-80),140); ////////////////
    ctx.fillText("[M-(D/H)+Br]",20+((maxPeak+(80/charge)-minX)/(maxX-minX))*(canvas.width-80),140); ////////////////
    ctx.font = "12px Arial";
    ctx.fillStyle = "red";
    ctx.fillText(chargeValue.toString() + "+",135+((maxPeak+(36/charge)-minX)/(maxX-minX))*(canvas.width-80),132); ////////////////
    ctx.fillText(chargeValue.toString() + "+",135+((maxPeak+(80/charge)-minX)/(maxX-minX))*(canvas.width-80),132);
  }
  
  ctx.font = "12px Arial";
  ctx.fillStyle = "red";
  ctx.fillText(chargeValue.toString() + "+", 80+((maxPeak-minX)/(maxX-minX))*(canvas.width-80),132);
  
}




function run(){
  const f=document.getElementById('formula').value;

  draw(isotopePatternFFT(f),chargeValue,"plot","         [M]");
  draw(isotopePatternFFTRemoveDAddCl(f),chargeValue,"plot2","[M-D+Cl]"); ////////////////
  draw(isotopePatternFFTRemoveHAddCl(f),chargeValue,"plot3","[M-H+Cl]"); ////////////////
  draw(isotopePatternFFTRemoveDAddBr(f),chargeValue,"plot4","[M-D+Br]"); ////////////////
  draw(isotopePatternFFTRemoveHAddBr(f),chargeValue,"plot5","[M-H+Br]"); ////////////////

  draw2(addIsotopeHalidePatterns(isotopePatternFFTRemoveDAddCl(f),isotopePatternFFTRemoveHAddCl(f)),chargeValue,"plot6","[M-(D/H)+Cl]");
  draw2(addIsotopeHalidePatterns(isotopePatternFFTRemoveDAddBr(f),isotopePatternFFTRemoveHAddBr(f)),chargeValue,"plot7","[M-(D/H)+Br]");

  drawAll(addIsotopePatterns(isotopePatternFFT(f), isotopePatternFFTRemoveDAddCl(f),isotopePatternFFTRemoveHAddCl(f),isotopePatternFFTRemoveDAddBr(f),isotopePatternFFTRemoveHAddBr(f)),chargeValue,"plot8","Overlayed",f);
}

</script>
