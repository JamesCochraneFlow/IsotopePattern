<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Isotope Pattern Calculator</title>
<style>
body {  font-family: Arial, Helvetica, sans-serif; }
input, button { font-size: 15px; padding: 4px 4px; }
</style>
</head>
<body>
<h2>Isotope Pattern Calculator</h2>
<label>Molecular formula:
<input id="formula" value="C66H31D41N4OPt" />
</label>
<button onclick="run()">Calculate</button>
<label style="margin-left: 100px;">Intensity cutoff:</label>
<input type="range" id="cutoffSlider" min="-15" max="-1" step="1" value="-6" oninput="updateCutoffLabel()" style="width:100px;
 margin-left: 5px;
  height: 2px;
  border-radius: 5px;  
  background: #d3d3d3;
  outline: none;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;  ">
<br><br>
<canvas id="plot" width="700" height="150"></canvas>
<canvas id="plot2" width="700" height="150"></canvas>
<canvas id="plot3" width="700" height="150"></canvas>
<canvas id="plot4" width="700" height="150"></canvas>
<canvas id="plot5" width="700" height="150"></canvas>

<script>
let cutoffFactor = 1e-6;

function updateCutoffLabel(){
const slider=document.getElementById('cutoffSlider');
cutoffFactor = Math.pow(10, slider.value);
// document.getElementById('cutoffValue').innerText = cutoffFactor.toExponential(1);
    run();
}

const elements={
  C: { masses:[12.0000,13.003355], abundances:[0.9893,0.0107] },
  H: { masses:[1.00782503223,2.01410177812], abundances:[0.999885,0.000115] },
  D: { masses:[2.01410177812], abundances:[1.0] },
  N: { masses:[14.00307400443,15.000109], abundances:[0.99632,0.00368] },
  O: { masses:[15.99491461957,16.999132,17.999160], abundances:[0.99757,0.00038,0.00205] },
  P: { masses:[30.97376199842], abundances:[1.0] },
  Si:{ masses:[27.97692653465,28.976495,29.973770], abundances:[0.92223,0.04685,0.03092] },
  Cl:{ masses:[34.968852682,36.96590259], abundances:[0.7576,0.2424] },
  Br:{ masses:[78.9183376,80.916291], abundances:[0.5069,0.4931] },
  Ir:{ masses:[192.962926, 194.964791, 195.964784, 196.965881, 198.967], abundances:[0.373, 0.627, 0, 0, 0] }, // iridium
  Pt:{ masses:[194.9647917,195.964,196.964,198.964], abundances:[0.3383,0.3296,0.2524,0.0797] }
};

const protonMass=1.007276466812;
const binSize=0.05;

function parseFormula(formula){
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }
  return comp;
}

function parseFormulaRemoveDAddCl(formula){ //////////////
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }
  if (!("Cl" in comp)){
    comp["Cl"] = 1;
  }
  else {
    comp["Cl"] += 1;
  }
  comp["D"] -= 1;
  return comp;
}

function parseFormulaRemoveHAddCl(formula){ //////////////
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }
  

  if (!("Cl" in comp)){
    comp["Cl"] = 1;
  }
  else {
    comp["Cl"] += 1;
  }
  comp["H"] -= 1;
  return comp;
}

function parseFormulaRemoveDAddBr(formula){ //////////////
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }
  if (!("Br" in comp)){
    comp["Br"] = 1;
  }
  else {
    comp["Br"] += 1;
  }
  comp["D"] -= 1;
  return comp;
}

function parseFormulaRemoveHAddBr(formula){ //////////////
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }

  if (!("Br" in comp)){
    comp["Br"] = 1;
  }
  else {
    comp["Br"] += 1;
  }

  comp["H"] -= 1;
 
  return comp;
}

function generateElementArray(element,count){
  const data=elements[element];
  const poly=[];
  for(let i=0;i<data.masses.length;i++) poly.push({mass:data.masses[i], intensity:data.abundances[i]});
  let dist=[{mass:0,intensity:1}];
  for(let j=0;j<count;j++){
    const tmp=[];
    for(const d of dist){
      for(const p of poly){
        tmp.push({mass:d.mass+p.mass, intensity:d.intensity*p.intensity});
      }
    }
    dist=mergeBins(tmp);
  }
  return dist;
}

function mergeBins(peaks){
  const bins={};
  for(const p of peaks){
    const key=Math.round(p.mass/binSize)*binSize;
    if(!bins[key]) bins[key]=0;
    bins[key]+=p.intensity;
  }
  return Object.entries(bins).map(([mass,intensity])=>({mass:parseFloat(mass),intensity}));
}

function convolveSparse(a,b){
  const result=[];
  for(const pa of a){
    for(const pb of b){
      result.push({mass:pa.mass+pb.mass, intensity:pa.intensity*pb.intensity});
    }
  }
  return mergeBins(result);
}

function isotopePatternFFT(formula){
  const comp=parseFormula(formula);
  let dist=[{mass:0,intensity:1}];
  for(const el in comp){
    const elArr=generateElementArray(el,comp[el]);
    dist=convolveSparse(dist,elArr);
  }
  const maxI=Math.max(...dist.map(p=>p.intensity));
  return dist.map(p=>({mass:p.mass,intensity:p.intensity/maxI})).filter(p=>p.intensity>cutoffFactor);
}

function isotopePatternFFTRemoveDAddCl(formula){
  const comp=parseFormulaRemoveDAddCl(formula);
  let dist=[{mass:0,intensity:1}];
  for(const el in comp){
    const elArr=generateElementArray(el,comp[el]);
    dist=convolveSparse(dist,elArr);
  }
  const maxI=Math.max(...dist.map(p=>p.intensity));
  return dist.map(p=>({mass:p.mass,intensity:p.intensity/maxI})).filter(p=>p.intensity>cutoffFactor);
}


function isotopePatternFFTRemoveHAddCl(formula){
  const comp=parseFormulaRemoveHAddCl(formula);
  let dist=[{mass:0,intensity:1}];
  for(const el in comp){
    const elArr=generateElementArray(el,comp[el]);
    dist=convolveSparse(dist,elArr);
  }
  const maxI=Math.max(...dist.map(p=>p.intensity));
  return dist.map(p=>({mass:p.mass,intensity:p.intensity/maxI})).filter(p=>p.intensity>cutoffFactor);
}

function isotopePatternFFTRemoveDAddBr(formula){
  const comp=parseFormulaRemoveDAddBr(formula);
  let dist=[{mass:0,intensity:1}];
  for(const el in comp){
    const elArr=generateElementArray(el,comp[el]);
    dist=convolveSparse(dist,elArr);
  }
  const maxI=Math.max(...dist.map(p=>p.intensity));
  return dist.map(p=>({mass:p.mass,intensity:p.intensity/maxI})).filter(p=>p.intensity>cutoffFactor);
}

function isotopePatternFFTRemoveHAddBr(formula){
  const comp=parseFormulaRemoveHAddBr(formula);
  let dist=[{mass:0,intensity:1}];
  for(const el in comp){
    const elArr=generateElementArray(el,comp[el]);
    dist=convolveSparse(dist,elArr);
  }
  const maxI=Math.max(...dist.map(p=>p.intensity));
  return dist.map(p=>({mass:p.mass,intensity:p.intensity/maxI})).filter(p=>p.intensity>cutoffFactor);
}

function draw(peaks,charge=1,plotid,title){
  const canvas=document.getElementById(plotid);
  const ctx=canvas.getContext('2d');
  ctx.font = "11px Arial";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const mz=peaks.map(p=>(p.mass+charge*protonMass)/charge);
  const minMz=Math.min(...mz), maxMz=Math.max(...mz);
  ctx.beginPath();
  peaks.forEach((p,i)=>{
    const x=50+((mz[i]-minMz)/(maxMz-minMz))*(canvas.width-80);
    const y=canvas.height-30;
    const h=p.intensity*(canvas.height-60);
    ctx.moveTo(x,y); ctx.lineTo(x,y-h);
    x_string = parseFloat(mz[i].toFixed(2)); ////////////////////////
    ctx.fillText(x_string,x-15,y-h-5); ////////////////
   
  });
  ctx.stroke();
//   ctx.fillText(minMz.toFixed(2),40,canvas.height-10);
//   ctx.fillText(maxMz.toFixed(2),canvas.width-80,canvas.height-10);
  const monoMass=Math.min(...mz);
  ctx.font = "20px Arial";
  ctx.fillText(title,600,50); ////////////////
//   ctx.fillText('Mono: '+monoMass.toFixed(2),50,canvas.height-25);
}

function run(){
  const f=document.getElementById('formula').value;
  const peaks=isotopePatternFFT(f);
  draw(peaks,1,"plot","M");
  draw(isotopePatternFFTRemoveDAddCl(f),1,"plot2","M-D+Cl"); ////////////////
  draw(isotopePatternFFTRemoveHAddCl(f),1,"plot3","M-H+Cl"); ////////////////
  draw(isotopePatternFFTRemoveDAddBr(f),1,"plot4","M-D+Br"); ////////////////
  draw(isotopePatternFFTRemoveHAddBr(f),1,"plot5","M-H+Br"); ////////////////
}

</script>
</body>
</html>
