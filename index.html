<title>Isotope Pattern Tool</title>
<style>
body {  font-family: Arial, Helvetica, sans-serif; }
canvas {border:1px solid black}
input, button { font-size: 15px; padding: 4px 4px; }
</style>

<body>
<h2>Isotope Pattern Tool</h2>
<label>Molecular formula:
<input id="formula" value="" placeholder="C78H28D38N4OPtSi" />
</label>
<button onclick="run()">Calculate</button>
<label style="margin-left: 20px;"><span id = "charge">Charge (n+)</span></label>
<input type="range" id="ncharge" min="0" max="3" step="1" value="0" oninput="charge()" style="width:100px;
 margin-left: 5px;
  height: 2px;
  border-radius: 5px;  
  background: #d3d3d3;
  outline: none;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;  ">
  <button style="margin-left: 240px;" onclick="info()">Tool information &#9432;</button>
<br><br>
<label style="margin-left: 0px;">Intensity cutoff (zoom)</label>
<input type="range" id="cutoffSlider" min="-50" max="-1" step="1" value="-10" oninput="updateCutoffLabel()" style="width:100px;
 margin-left: 5px;
  height: 2px;
  border-radius: 5px;  
  background: #d3d3d3;
  outline: none;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;  ">

<label style="margin-left: 20px;"><span id = "nValue">Swap nD for nH</span></label>
<input type="range" id="nSlider" min="0" max="9" step="1" value="0" oninput="updateN()" style="width:100px;
 margin-left: 5px;
  height: 2px;
  border-radius: 5px;  
  background: #d3d3d3;
  outline: none;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;  ">

<label style="margin-left: 20px;"><span id = "thickness">Line thickness</span></label>
<input type="range" id="nthickness" min="1" max="10" step="1" value="4" oninput="thickness()" style="width:100px;
 margin-left: 5px;
  height: 2px;
  border-radius: 5px;  
  background: #d3d3d3;
  outline: none;
  opacity: 0.7;
  -webkit-transition: .2s;
  transition: opacity .2s;  ">

<label style="margin-left: 20px;"><span id = "masstoggle">Show masses (on/off)</span></label>
<input type="range" id="nmasstoggle" min="0" max="1" step="1" value="0" oninput="masstoggle()" style="width:30px;
 margin-left: 5px;
  height: 2px;
  border-radius: 5px;  
  background: #d3d3d3;
  outline: none;
  opacity: 0.7;

function parseFormula(formula){
  const re=/([A-Z][a-z]*)(\d*)/g;
  const comp={};
  let m;
  while((m=re.exec(formula))){
    const el=m[1]; const n=m[2]?parseInt(m[2],10):1;
    comp[el]=(comp[el]||0)+n;
  }
  if (!("H" in comp)){
    comp["D"] -= nValue;
    comp["H"] = nValue;
  }
  else if (!("D" in comp)) {
  comp["D"] = -nValue;
  comp["H"] += nValue;
  }
  else {
    comp["H"] += nValue;
    comp["D"] -= nValue;
  }
  return comp;
}

}



function binShifts(peaks){
const bins = new Map();
const lowMassBin = 0.001; // high-precision bin for low-mass elements
const highMassBin = 0.001; // slightly coarser for high-mass elements


for(const p of peaks){
if(typeof p.mass !== 'number' || typeof p.intensity !== 'number')
throw new Error('Invalid peak: '+JSON.stringify(p));


const bin = Math.abs(p.mass) < 50 ? lowMassBin : highMassBin;
// floating-point stable binning
const key = Math.round((p.mass + 1e-12) / bin) * bin;
bins.set(key, (bins.get(key) || 0) + p.intensity);
}


// preserve zero-shift peak
if(!bins.has(0)) bins.set(0, (bins.get(0) || 0));


return [...bins.entries()].map(([m,i]) => ({ mass: m, intensity: i }));
}



function generateElementArray(element, count){
const data = elements[element];
if(!data) throw new Error('Unknown element: '+element);
const mono = data.masses[0];


const poly = data.masses.map((m,i) => ({ mass: m - mono, intensity: data.abundances[i] }));


let dist = [{ mass: 0, intensity: 1 }];
for(let j=0; j<count; j++){
const tmp = [];
for(const d of dist){
for(const p of poly){
tmp.push({ mass: d.mass + p.mass, intensity: d.intensity * p.intensity });
}
}
dist = binShifts(tmp);
}
return dist;
}



function convolve(a,b){
const tmp = [];
for(const x of a){
for(const y of b){
tmp.push({ mass: x.mass + y.mass, intensity: x.intensity * y.intensity });
}
}
if(!tmp.some(p => p.mass === 0)) tmp.push({ mass:0,intensity:0 });
return binShifts(tmp);
}

function isotopePatternFFT(formula){
const comp = parseFormula(formula);
let monoMass = 0;
let dist = [{ mass: 0, intensity: 1 }];


for(const el in comp){
const e = elements[el];
if(!e) throw new Error('Unknown element: '+el);
dist = convolve(dist, generateElementArray(el, comp[el]));
monoMass += e.masses[0] * comp[el];
}


const maxI = Math.max(...dist.map(p => p.intensity));
if(maxI <= 0 || !isFinite(maxI)) throw new Error('Invalid max intensity');


return dist.map(p => ({ mass: monoMass + p.mass, intensity: p.intensity / maxI }))
.filter(p => p.intensity > cutoffFactor);
}

function draw(peaks, charge, plotid, title, colorx) {
  const canvas = document.getElementById(plotid);
  const ctx = canvas.getContext('2d');
  ctx.font = "11px Arial";
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Decide axis values explicitly
  const xvals = peaks.map(p =>
    charge > 0
      ? (p.mass + charge * protonMass) / charge   // m/z
      : p.mass                                    // neutral mass
  );

  const minX = Math.min(...xvals);
  const maxX = Math.max(...xvals);

  ctx.beginPath();

  peaks.forEach((p, i) => {
    const x = 50 + ((xvals[i] - minX) / (maxX - minX)) * (canvas.width - 80);
    const y = canvas.height - 30;
    const h = p.intensity * (canvas.height - 60);

    ctx.moveTo(x, y);
    ctx.lineTo(x, y - h);
    ctx.lineWidth = thicknessvalue;

    ctx.fillStyle = "black";
    if (masstogglevalue == 0) {
    x_string = parseFloat(xvals[i].toFixed(2)); ////////////////////////
    ctx.fillText(x_string,x-15,y-h-5);
    } 
    else {}
  });

  ctx.stroke();

  ctx.font = "20px Arial";
  ctx.fillStyle = colorx;
  ctx.fillText(title, 850, 30);

  ctx.font = "12px Arial";
  ctx.fillStyle = colorx;
  ctx.fillText(chargeValue.toString() + "+", 934, 20);
}

function addIsotopePatterns(p1, p2, p3, p4, p5) {
  const map = new Map();

  function addPeaks(peaks) {
    for (let i = 0; i < peaks.length; i++) {
      const p = peaks[i];
      const bin = p.mass < 50 ? lowMassBin : highMassBin;
      const key = Math.round(p.mass / bin) * bin;
      map.set(key, (map.get(key) || 0) + p.intensity);
    }
  }

  addPeaks(p1);
  addPeaks(p2);
  addPeaks(p3);
  addPeaks(p4);
  addPeaks(p5);

  let maxI = 0;
  for (const v of map.values()) {
    if (v > maxI) maxI = v;
  }

  const out = [];
  for (const [m, i] of map.entries()) {
    const norm = i / maxI;
    if (norm > cutoffFactor) {
      out.push({ mass: m, intensity: norm });
    }
  }

  return out;
}


function addIsotopeHalidePatterns(p1, p2) {
  const map = new Map();

  function addPeaks(peaks) {
    for (let i = 0; i < peaks.length; i++) {
      const p = peaks[i];
      const bin = p.mass < 50 ? lowMassBin : highMassBin;
      const key = Math.round(p.mass / bin) * bin;
      map.set(key, (map.get(key) || 0) + p.intensity);
    }
  }

  addPeaks(p1);
  addPeaks(p2);
 
  let maxI = 0;
  for (const v of map.values()) {
    if (v > maxI) maxI = v;
  }

  const out = [];
  for (const [m, i] of map.entries()) {
    const norm = i / maxI;
    if (norm > cutoffFactor) {
      out.push({ mass: m, intensity: norm });
    }
  }

  return out;
}
